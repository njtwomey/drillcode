kind: function
entry: Solution.isInterleave
scaffolds: []
args: [s1, s2, s3]
cases:
  - name: example 1
    input: {s1: "aabcc", s2: "dbbca", s3: "aadbbcbcac"}
    expected: true
  - name: example 2
    input: {s1: "aabcc", s2: "dbbca", s3: "aadbbbaccc"}
    expected: false
  - name: example 3 all empty
    input: {s1: "", s2: "", s3: ""}
    expected: true
  - name: second empty
    input: {s1: "a", s2: "", s3: "a"}
    expected: true
  - name: first empty mismatch
    input: {s1: "", s2: "b", s3: "a"}
    expected: false
  - name: length mismatch
    input: {s1: "a", s2: "b", s3: "abc"}
    expected: false
  - name: either order of single characters
    input: {s1: "a", s2: "b", s3: "ba"}
    expected: true
  - name: shared first letter needs backtracking
    input: {s1: "aa", s2: "ab", s3: "aaba"}
    expected: true
  - name: right letters wrong order
    input: {s1: "ab", s2: "cd", s3: "adbc"}
    expected: false
  - name: same letters but s2 order broken
    input: {s1: "ab", s2: "cd", s3: "acdb"}
    expected: true
