kind: function
entry: Solution.largestRectangleArea
scaffolds: []
args: [heights]
cases:
  - name: example 1
    input: {heights: [2, 1, 5, 6, 2, 3]}
    expected: 10
  - name: example 2
    input: {heights: [2, 4]}
    expected: 4
  - name: single bar
    input: {heights: [7]}
    expected: 7
  - name: single zero bar
    input: {heights: [0]}
    expected: 0
  - name: all equal heights
    input: {heights: [3, 3, 3, 3]}
    expected: 12
  - name: strictly increasing
    input: {heights: [1, 2, 3, 4, 5]}
    expected: 9
  - name: strictly decreasing
    input: {heights: [5, 4, 3, 2, 1]}
    expected: 9
  - name: valley is widest
    input: {heights: [2, 1, 2]}
    expected: 3
  - name: zero splits the histogram
    input: {heights: [2, 0, 2]}
    expected: 2
  - name: mixed with equal peaks
    input: {heights: [6, 2, 5, 4, 5, 1, 6]}
    expected: 12
