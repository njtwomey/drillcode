kind: function
entry: Solution.longestIncreasingPath
scaffolds: []
args: [matrix]
cases:
  - name: example 1
    input: {matrix: [[9, 9, 4], [6, 6, 8], [2, 1, 1]]}
    expected: 4
  - name: example 2 turning path
    input: {matrix: [[3, 4, 5], [3, 2, 6], [2, 2, 1]]}
    expected: 4
  - name: example 3 single cell
    input: {matrix: [[1]]}
    expected: 1
  - name: all equal
    input: {matrix: [[1, 1], [1, 1]]}
    expected: 1
  - name: single row ascending
    input: {matrix: [[1, 2, 3, 4]]}
    expected: 4
  - name: single column descending
    input: {matrix: [[5], [4], [3], [2]]}
    expected: 4
  - name: spiral covers every cell
    input: {matrix: [[1, 2, 3], [8, 9, 4], [7, 6, 5]]}
    expected: 9
  - name: zeros and large values
    input: {matrix: [[0, 2147483647], [1, 2]]}
    expected: 4
