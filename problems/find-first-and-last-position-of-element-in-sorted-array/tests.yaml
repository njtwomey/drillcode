kind: function
entry: Solution.searchRange
scaffolds: []
args: [nums, target]
cases:
  - name: example 1
    input: {nums: [5, 7, 7, 8, 8, 10], target: 8}
    expected: [3, 4]
  - name: example 2 absent
    input: {nums: [5, 7, 7, 8, 8, 10], target: 6}
    expected: [-1, -1]
  - name: example 3 empty
    input: {nums: [], target: 0}
    expected: [-1, -1]
  - name: single element match
    input: {nums: [1], target: 1}
    expected: [0, 0]
  - name: all equal to target
    input: {nums: [2, 2, 2, 2, 2], target: 2}
    expected: [0, 4]
  - name: target at the start only
    input: {nums: [1, 2, 3, 4], target: 1}
    expected: [0, 0]
  - name: target at the end only
    input: {nums: [1, 2, 3, 4], target: 4}
    expected: [3, 3]
  - name: target above all
    input: {nums: [1, 2, 3], target: 9}
    expected: [-1, -1]
  - name: target below all
    input: {nums: [4, 5, 6], target: 1}
    expected: [-1, -1]
  - name: run at the start
    input: {nums: [3, 3, 3, 5, 8], target: 3}
    expected: [0, 2]
