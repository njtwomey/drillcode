kind: function
entry: Solution.kClosest
scaffolds: []
args: [points, k]
compare: unordered
cases:
  - name: example 1
    input: {points: [[1, 3], [-2, 2]], k: 1}
    expected: [[-2, 2]]
  - name: example 2
    input: {points: [[3, 3], [5, -1], [-2, 4]], k: 2}
    expected: [[3, 3], [-2, 4]]
  - name: k equals number of points
    input: {points: [[3, 3], [5, -1], [-2, 4]], k: 3}
    expected: [[3, 3], [5, -1], [-2, 4]]
  - name: single point
    input: {points: [[7, 7]], k: 1}
    expected: [[7, 7]]
  - name: point at the origin
    input: {points: [[1, 1], [0, 0]], k: 1}
    expected: [[0, 0]]
  - name: negative coordinates
    input: {points: [[-5, -5], [1, 0], [0, 2]], k: 2}
    expected: [[1, 0], [0, 2]]
  - name: unsorted input
    input: {points: [[2, 2], [1, 1], [3, 3], [0, 5]], k: 3}
    expected: [[2, 2], [1, 1], [3, 3]]
