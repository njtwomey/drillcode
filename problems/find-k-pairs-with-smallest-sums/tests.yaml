kind: function
entry: Solution.kSmallestPairs
scaffolds: []
args: [nums1, nums2, k]
compare: validator
cases:
  - name: example 1
    input: {nums1: [1, 7, 11], nums2: [2, 4, 6], k: 3}
    expected: [[1, 2], [1, 4], [1, 6]]
  - name: example 2 duplicates
    input: {nums1: [1, 1, 2], nums2: [1, 2, 3], k: 2}
    expected: [[1, 1], [1, 1]]
  - name: k exceeds the number of pairs
    input: {nums1: [1, 2], nums2: [3], k: 3}
    expected: [[1, 3], [2, 3]]
  - name: k one
    input: {nums1: [5, 6], nums2: [1, 9], k: 1}
    expected: [[5, 1]]
  - name: all pairs requested
    input: {nums1: [1, 1, 2], nums2: [1, 2, 3], k: 9}
    expected: [[1, 1], [1, 1], [1, 2], [1, 2], [2, 1], [1, 3], [1, 3], [2, 2], [2, 3]]
  - name: negatives and ties
    input: {nums1: [-5, -1, 0], nums2: [-3, -3, 2], k: 4}
    expected: [[-5, -3], [-5, -3], [-1, -3], [-1, -3]]
  - name: second array advances before first
    input: {nums1: [1, 10, 20], nums2: [1, 2, 3, 4], k: 4}
    expected: [[1, 1], [1, 2], [1, 3], [1, 4]]
  - name: later row beats earlier columns
    input: {nums1: [1, 2, 3], nums2: [1, 5, 9], k: 4}
    expected: [[1, 1], [2, 1], [3, 1], [1, 5]]
