kind: function
entry: Solution.pathSum
scaffolds: [tree]
args: [root, targetSum]
convert:
  root: tree
compare: unordered
cases:
  - name: example 1 two paths
    input: {root: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, 5, 1], targetSum: 22}
    expected: [[5, 4, 11, 2], [5, 8, 4, 5]]
  - name: example 2 no path
    input: {root: [1, 2, 3], targetSum: 5}
    expected: []
  - name: example 3 non-leaf prefix
    input: {root: [1, 2], targetSum: 0}
    expected: []
  - name: empty tree
    input: {root: [], targetSum: 0}
    expected: []
  - name: single node
    input: {root: [1], targetSum: 1}
    expected: [[1]]
  - name: stopping at a non-leaf is wrong
    input: {root: [1, 2], targetSum: 1}
    expected: []
  - name: negative values and a deep leaf
    input: {root: [1, -2, -3, 1, 3, -2, null, -1], targetSum: -1}
    expected: [[1, -2, 1, -1]]
  - name: zeros give two identical paths
    input: {root: [0, 0, 0], targetSum: 0}
    expected: [[0, 0], [0, 0]]
  - name: zero-valued leaf
    input: {root: [1, 0], targetSum: 1}
    expected: [[1, 0]]
