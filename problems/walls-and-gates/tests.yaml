kind: function
entry: Solution.wallsAndGates
scaffolds: []
args: [rooms]
compare: in_place:rooms
cases:
  - name: example 1
    input:
      rooms:
        - [2147483647, -1, 0, 2147483647]
        - [2147483647, 2147483647, 2147483647, -1]
        - [2147483647, -1, 2147483647, -1]
        - [0, -1, 2147483647, 2147483647]
    expected:
      - [3, -1, 0, 1]
      - [2, 2, 1, -1]
      - [1, -1, 2, -1]
      - [0, -1, 3, 4]
  - name: example 2 only a wall
    input: {rooms: [[-1]]}
    expected: [[-1]]
  - name: single gate
    input: {rooms: [[0]]}
    expected: [[0]]
  - name: no gates stays INF
    input: {rooms: [[2147483647, 2147483647], [2147483647, -1]]}
    expected: [[2147483647, 2147483647], [2147483647, -1]]
  - name: room walled off from every gate
    input:
      rooms:
        - [0, 2147483647, -1, 2147483647]
        - [2147483647, 2147483647, -1, 2147483647]
    expected:
      - [0, 1, -1, 2147483647]
      - [1, 2, -1, 2147483647]
  - name: two gates, nearest wins
    input: {rooms: [[0, 2147483647, 2147483647, 2147483647, 0]]}
    expected: [[0, 1, 2, 1, 0]]
  - name: detour around a wall
    input:
      rooms:
        - [0, -1, 2147483647]
        - [2147483647, -1, 2147483647]
        - [2147483647, 2147483647, 2147483647]
    expected:
      - [0, -1, 6]
      - [1, -1, 5]
      - [2, 3, 4]
  - name: gates in opposite corners
    input:
      rooms:
        - [0, 2147483647, 2147483647]
        - [2147483647, 2147483647, 2147483647]
        - [2147483647, 2147483647, 0]
    expected:
      - [0, 1, 2]
      - [1, 2, 1]
      - [2, 1, 0]
