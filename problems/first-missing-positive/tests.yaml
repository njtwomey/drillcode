kind: function
entry: Solution.firstMissingPositive
scaffolds: []
args: [nums]
cases:
  - name: example 1
    input: {nums: [1, 2, 0]}
    expected: 3
  - name: example 2
    input: {nums: [3, 4, -1, 1]}
    expected: 2
  - name: example 3 all above n
    input: {nums: [7, 8, 9, 11, 12]}
    expected: 1
  - name: single one
    input: {nums: [1]}
    expected: 2
  - name: single two
    input: {nums: [2]}
    expected: 1
  - name: duplicates of the same value
    input: {nums: [1, 1]}
    expected: 2
  - name: only zero
    input: {nums: [0]}
    expected: 1
  - name: only negatives
    input: {nums: [-1, -2]}
    expected: 1
  - name: full permutation
    input: {nums: [4, 2, 1, 3, 5]}
    expected: 6
  - name: duplicates negatives zeros
    input: {nums: [0, 2, 2, 1, 1, -3]}
    expected: 3
  - name: huge value is ignored
    input: {nums: [1000000, 1, 2]}
    expected: 3
  - name: repeated value hides the gap
    input: {nums: [3, 3, 3, 3]}
    expected: 1
