kind: function
entry: Solution.maxArea
scaffolds: []
args: [height]
cases:
  - name: example 1
    input: {height: [1, 8, 6, 2, 5, 4, 8, 3, 7]}
    expected: 49
  - name: example 2 two elements
    input: {height: [1, 1]}
    expected: 1
  - name: all heights equal
    input: {height: [5, 5, 5, 5]}
    expected: 15
  - name: zero height at an end
    input: {height: [0, 5]}
    expected: 0
  - name: zeros at both ends
    input: {height: [0, 2, 0]}
    expected: 0
  - name: widest is best
    input: {height: [4, 3, 2, 1, 4]}
    expected: 16
  - name: best pair is interior
    input: {height: [1, 2, 4, 3]}
    expected: 4
  - name: increasing
    input: {height: [1, 2, 3, 4, 5, 6]}
    expected: 9
  - name: tall pair in the middle
    input: {height: [1, 1, 10, 10, 1, 1]}
    expected: 10
