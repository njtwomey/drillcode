kind: function
entry: Solution.findKthLargest
scaffolds: []
args: [nums, k]
cases:
  - name: example 1
    input: {nums: [3, 2, 1, 5, 6, 4], k: 2}
    expected: 5
  - name: example 2
    input: {nums: [3, 2, 3, 1, 2, 4, 5, 5, 6], k: 4}
    expected: 4
  - name: single element
    input: {nums: [1], k: 1}
    expected: 1
  - name: k = 1 is the maximum
    input: {nums: [3, 1, 2], k: 1}
    expected: 3
  - name: k = n is the minimum
    input: {nums: [3, 1, 2], k: 3}
    expected: 1
  - name: all duplicates
    input: {nums: [2, 2, 2], k: 2}
    expected: 2
  - name: negatives
    input: {nums: [-1, -5, -3], k: 2}
    expected: -3
  - name: descending input
    input: {nums: [7, 6, 5, 4, 3, 2, 1], k: 5}
    expected: 3
