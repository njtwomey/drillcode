kind: function
entry: Solution.alienOrder
scaffolds: []
args: [words]
compare: validator
cases:
  - name: example 1
    input: {words: ["wrt", "wrf", "er", "ett", "rftt"]}
    expected: "wertf"
  - name: example 2
    input: {words: ["z", "x"]}
    expected: "zx"
  - name: example 3 cycle
    input: {words: ["z", "x", "z"]}
    expected: ""
  - name: word followed by its own prefix
    input: {words: ["abc", "ab"]}
    expected: ""
  - name: single word
    input: {words: ["abc"]}
    expected: "abc"
  - name: unconstrained letters included
    input: {words: ["ab", "adc"]}
    expected: "abcd"
  - name: longer cycle
    input: {words: ["ba", "bc", "ac", "ab"]}
    expected: ""
  - name: duplicate words
    input: {words: ["a", "a"]}
    expected: "a"
  - name: prefix first is fine
    input: {words: ["ab", "abc", "b"]}
    expected: "abc"
