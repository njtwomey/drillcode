kind: operations
entry: SnapshotArray
scaffolds: []
cases:
  - name: example 1
    ops: [["SnapshotArray", [3]], ["set", [0, 5]], ["snap", []], ["set", [0, 6]], ["get", [0, 0]]]
    expected: [null, null, 0, null, 5]
  - name: untouched index reads zero
    ops: [["SnapshotArray", [2]], ["snap", []], ["get", [1, 0]], ["get", [0, 0]]]
    expected: [null, 0, 0, 0]
  - name: several sets before one snap keep the last
    ops: [["SnapshotArray", [1]], ["set", [0, 1]], ["set", [0, 2]], ["snap", []], ["set", [0, 3]], ["get", [0, 0]], ["snap", []], ["get", [0, 1]]]
    expected: [null, null, null, 0, null, 2, 1, 3]
  - name: snaps in which an index is not touched
    ops: [["SnapshotArray", [1]], ["set", [0, 7]], ["snap", []], ["snap", []], ["snap", []], ["set", [0, 9]], ["snap", []], ["get", [0, 0]], ["get", [0, 1]], ["get", [0, 2]], ["get", [0, 3]]]
    expected: [null, null, 0, 1, 2, null, 3, 7, 7, 7, 9]
  - name: indices are independent
    ops: [["SnapshotArray", [3]], ["set", [0, 1]], ["set", [2, 3]], ["snap", []], ["set", [1, 2]], ["snap", []], ["get", [0, 0]], ["get", [1, 0]], ["get", [1, 1]], ["get", [2, 1]]]
    expected: [null, null, null, 0, null, 1, 1, 0, 2, 3]
  - name: set back to zero after a snap
    ops: [["SnapshotArray", [1]], ["set", [0, 5]], ["snap", []], ["set", [0, 0]], ["snap", []], ["get", [0, 0]], ["get", [0, 1]]]
    expected: [null, null, 0, null, 1, 5, 0]
  - name: old snapshots stay fixed after later sets
    ops: [["SnapshotArray", [2]], ["set", [1, 10]], ["snap", []], ["set", [1, 20]], ["snap", []], ["set", [1, 30]], ["snap", []], ["get", [1, 0]], ["get", [1, 1]], ["get", [1, 2]]]
    expected: [null, null, 0, null, 1, null, 2, 10, 20, 30]
