kind: function
entry: Solution.checkInclusion
scaffolds: []
args: [s1, s2]
cases:
  - name: example 1
    input: {s1: "ab", s2: "eidbaooo"}
    expected: true
  - name: example 2
    input: {s1: "ab", s2: "eidboaoo"}
    expected: false
  - name: single equal letters
    input: {s1: "a", s2: "a"}
    expected: true
  - name: s1 longer than s2
    input: {s1: "abc", s2: "ab"}
    expected: false
  - name: match at the very end
    input: {s1: "adc", s2: "dcda"}
    expected: true
  - name: right letters wrong counts
    input: {s1: "aa", s2: "aba"}
    expected: false
  - name: near misses throughout
    input: {s1: "hello", s2: "ooolleoooleh"}
    expected: false
  - name: whole string is a permutation
    input: {s1: "ab", s2: "ba"}
    expected: true
  - name: window slides past junk
    input: {s1: "abc", s2: "bbbca"}
    expected: true
  - name: letters never together
    input: {s1: "abc", s2: "ccccbbbbaaaa"}
    expected: false
