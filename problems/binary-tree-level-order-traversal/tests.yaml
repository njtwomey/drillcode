kind: function
entry: Solution.levelOrder
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [3, 9, 20, null, null, 15, 7]}
    expected: [[3], [9, 20], [15, 7]]
  - name: single node
    input: {root: [1]}
    expected: [[1]]
  - name: empty tree
    input: {root: []}
    expected: []
  - name: left skewed
    input: {root: [1, 2, null, 3, null, 4]}
    expected: [[1], [2], [3], [4]]
  - name: right skewed
    input: {root: [1, null, 2, null, 3]}
    expected: [[1], [2], [3]]
  - name: missing children in the middle
    input: {root: [1, 2, 3, null, 4, 5]}
    expected: [[1], [2, 3], [4, 5]]
