kind: function
entry: Solution.multiply
scaffolds: []
args: [num1, num2]
cases:
  - name: example 1
    input: {num1: "2", num2: "3"}
    expected: "6"
  - name: example 2
    input: {num1: "123", num2: "456"}
    expected: "56088"
  - name: zero times a long number
    input: {num1: "0", num2: "12345"}
    expected: "0"
  - name: zero times zero
    input: {num1: "0", num2: "0"}
    expected: "0"
  - name: carry chain
    input: {num1: "999", num2: "999"}
    expected: "998001"
  - name: single digits with two digit product
    input: {num1: "9", num2: "9"}
    expected: "81"
  - name: product gains a digit
    input: {num1: "5", num2: "2"}
    expected: "10"
  - name: trailing zeros
    input: {num1: "1000", num2: "1000"}
    expected: "1000000"
  - name: very long operand
    input: {num1: "99999999999999999999", num2: "9"}
    expected: "899999999999999999991"
  - name: both long
    input: {num1: "99999999999999999999", num2: "99999999999999999999"}
    expected: "9999999999999999999800000000000000000001"
