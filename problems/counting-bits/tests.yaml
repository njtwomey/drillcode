kind: function
entry: Solution.countBits
scaffolds: []
args: [n]
cases:
  - name: example 1
    input: {n: 2}
    expected: [0, 1, 1]
  - name: example 2
    input: {n: 5}
    expected: [0, 1, 1, 2, 1, 2]
  - name: n is 0
    input: {n: 0}
    expected: [0]
  - name: n is 1
    input: {n: 1}
    expected: [0, 1]
  - name: n is 8
    input: {n: 8}
    expected: [0, 1, 1, 2, 1, 2, 2, 3, 1]
  - name: n is 16 (power of two at the end)
    input: {n: 16}
    expected: [0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4, 1]
