kind: function
entry: Solution.findMedianSortedArrays
scaffolds: []
args: [nums1, nums2]
compare: float:0.00001
cases:
  - name: example 1 odd total
    input: {nums1: [1, 3], nums2: [2]}
    expected: 2.0
  - name: example 2 even total
    input: {nums1: [1, 2], nums2: [3, 4]}
    expected: 2.5
  - name: first empty
    input: {nums1: [], nums2: [1]}
    expected: 1.0
  - name: second empty
    input: {nums1: [2, 3, 4, 5], nums2: []}
    expected: 3.5
  - name: all zeros
    input: {nums1: [0, 0], nums2: [0, 0]}
    expected: 0.0
  - name: disjoint ranges
    input: {nums1: [1, 2, 3], nums2: [10, 20, 30, 40]}
    expected: 10.0
  - name: disjoint ranges reversed
    input: {nums1: [10, 20, 30, 40], nums2: [1, 2, 3]}
    expected: 10.0
  - name: interleaved
    input: {nums1: [1, 3, 5, 7], nums2: [2, 4, 6, 8]}
    expected: 4.5
  - name: negatives
    input: {nums1: [-5, -3], nums2: [-1]}
    expected: -3.0
  - name: very unequal sizes
    input: {nums1: [1], nums2: [2, 3, 4, 5, 6]}
    expected: 3.5
