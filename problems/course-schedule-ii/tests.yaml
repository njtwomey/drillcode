kind: function
entry: Solution.findOrder
scaffolds: []
args: [numCourses, prerequisites]
compare: validator
cases:
  - name: example 1
    input: {numCourses: 2, prerequisites: [[1, 0]]}
    expected: [0, 1]
  - name: example 2 diamond
    input: {numCourses: 4, prerequisites: [[1, 0], [2, 0], [3, 1], [3, 2]]}
    expected: [0, 1, 2, 3]
  - name: example 3 single course
    input: {numCourses: 1, prerequisites: []}
    expected: [0]
  - name: two-course cycle
    input: {numCourses: 2, prerequisites: [[1, 0], [0, 1]]}
    expected: []
  - name: no prerequisites
    input: {numCourses: 3, prerequisites: []}
    expected: [0, 1, 2]
  - name: cycle behind a valid prefix
    input: {numCourses: 4, prerequisites: [[1, 0], [2, 1], [3, 2], [1, 3]]}
    expected: []
  - name: duplicate pairs
    input: {numCourses: 2, prerequisites: [[1, 0], [1, 0]]}
    expected: [0, 1]
  - name: self prerequisite
    input: {numCourses: 2, prerequisites: [[0, 0]]}
    expected: []
  - name: long chain listed backwards
    input: {numCourses: 5, prerequisites: [[0, 1], [1, 2], [2, 3], [3, 4]]}
    expected: [4, 3, 2, 1, 0]
