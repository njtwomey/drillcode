kind: function
entry: Solution.swapPairs
scaffolds: [linked_list]
args: [head]
convert:
  head: linked_list
  result: linked_list
cases:
  - name: example 1
    input: {head: [1, 2, 3, 4]}
    expected: [2, 1, 4, 3]
  - name: example 2 empty
    input: {head: []}
    expected: []
  - name: example 3 single node
    input: {head: [1]}
    expected: [1]
  - name: example 4 odd length
    input: {head: [1, 2, 3]}
    expected: [2, 1, 3]
  - name: two nodes
    input: {head: [1, 2]}
    expected: [2, 1]
  - name: five nodes
    input: {head: [1, 2, 3, 4, 5]}
    expected: [2, 1, 4, 3, 5]
  - name: duplicate values
    input: {head: [7, 7, 8, 8, 9, 9]}
    expected: [7, 7, 8, 8, 9, 9]
  - name: six nodes
    input: {head: [1, 2, 3, 4, 5, 6]}
    expected: [2, 1, 4, 3, 6, 5]
