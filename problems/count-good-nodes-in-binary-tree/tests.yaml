kind: function
entry: Solution.goodNodes
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [3, 1, 4, 3, null, 1, 5]}
    expected: 4
  - name: example 2
    input: {root: [3, 3, null, 4, 2]}
    expected: 3
  - name: example 3 single node
    input: {root: [1]}
    expected: 1
  - name: all negative, only root good
    input: {root: [-1, -2, -3]}
    expected: 1
  - name: negative increasing chain
    input: {root: [-5, -3, null, -1]}
    expected: 3
  - name: equal values count as good
    input: {root: [2, 2, 2]}
    expected: 3
  - name: decreasing chain
    input: {root: [5, 4, null, 3, null, 2]}
    expected: 1
  - name: must compare to ancestor max, not parent
    input: {root: [3, 1, null, null, 2]}
    expected: 1
  - name: root with one smaller child
    input: {root: [2, 1, 3]}
    expected: 2
