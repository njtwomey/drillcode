kind: function
entry: Solution.findPeakElement
scaffolds: []
args: [nums]
compare: validator
cases:
  - name: example 1
    input: {nums: [1, 2, 3, 1]}
    expected: [2]
  - name: example 2 two peaks
    input: {nums: [1, 2, 1, 3, 5, 6, 4]}
    expected: [1, 5]
  - name: single element
    input: {nums: [1]}
    expected: [0]
  - name: two elements rising
    input: {nums: [1, 2]}
    expected: [1]
  - name: two elements falling
    input: {nums: [2, 1]}
    expected: [0]
  - name: strictly increasing
    input: {nums: [1, 2, 3, 4, 5, 6]}
    expected: [5]
  - name: strictly decreasing
    input: {nums: [6, 5, 4, 3, 2, 1]}
    expected: [0]
  - name: zigzag many peaks
    input: {nums: [1, 3, 2, 4, 3, 5, 4, 6, 1]}
    expected: [1, 3, 5, 7]
  - name: negative values
    input: {nums: [-5, -3, -4, -9]}
    expected: [1]
