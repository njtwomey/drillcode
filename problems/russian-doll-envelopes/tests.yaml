kind: function
entry: Solution.maxEnvelopes
scaffolds: []
args: [envelopes]
cases:
  - name: example 1
    input: {envelopes: [[5, 4], [6, 4], [6, 7], [2, 3]]}
    expected: 3
  - name: example 2 identical envelopes
    input: {envelopes: [[1, 1], [1, 1], [1, 1]]}
    expected: 1
  - name: single envelope
    input: {envelopes: [[1, 1]]}
    expected: 1
  - name: equal widths cannot nest
    input: {envelopes: [[1, 3], [1, 4], [1, 5], [1, 6]]}
    expected: 1
  - name: equal heights cannot nest
    input: {envelopes: [[1, 2], [2, 2], [3, 2]]}
    expected: 1
  - name: ascending height tie-break would give five
    input: {envelopes: [[4, 5], [4, 6], [6, 7], [2, 3], [1, 1]]}
    expected: 4
  - name: unsorted input chain of three
    input: {envelopes: [[3, 3], [1, 1], [2, 2]]}
    expected: 3
  - name: mixed widths with ties
    input: {envelopes: [[2, 100], [3, 200], [4, 300], [5, 500], [5, 400], [5, 250], [6, 370], [6, 360], [7, 380]]}
    expected: 5
