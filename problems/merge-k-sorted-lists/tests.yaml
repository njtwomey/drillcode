kind: function
entry: Solution.mergeKLists
scaffolds: [linked_list]
args: [lists]
convert:
  lists: linked_list_array
  result: linked_list
cases:
  - name: example 1
    input: {lists: [[1, 4, 5], [1, 3, 4], [2, 6]]}
    expected: [1, 1, 2, 3, 4, 4, 5, 6]
  - name: example 2 k is 0
    input: {lists: []}
    expected: []
  - name: example 3 one empty list
    input: {lists: [[]]}
    expected: []
  - name: all lists empty
    input: {lists: [[], [], []]}
    expected: []
  - name: empty lists among others
    input: {lists: [[], [1], [], [0, 2]]}
    expected: [0, 1, 2]
  - name: single list
    input: {lists: [[1, 2, 3]]}
    expected: [1, 2, 3]
  - name: duplicates and negatives
    input: {lists: [[-3, -1, -1], [-2, -1], [-3, 5]]}
    expected: [-3, -3, -2, -1, -1, -1, 5]
  - name: lists of very different lengths
    input: {lists: [[5], [1, 2, 3, 4, 6, 7, 8], [9]]}
    expected: [1, 2, 3, 4, 5, 6, 7, 8, 9]
