kind: operations
entry: NumArray
scaffolds: []
cases:
  - name: example 1
    ops: [["NumArray", [[1, 3, 5]]], ["sumRange", [0, 2]], ["update", [1, 2]], ["sumRange", [0, 2]]]
    expected: [null, 9, null, 8]
  - name: single element
    ops: [["NumArray", [[5]]], ["sumRange", [0, 0]], ["update", [0, -3]], ["sumRange", [0, 0]]]
    expected: [null, 5, null, -3]
  - name: negatives and middle update
    ops: [["NumArray", [[-1, 2, -3, 4]]], ["sumRange", [1, 3]], ["update", [2, 3]], ["sumRange", [0, 3]], ["sumRange", [2, 2]], ["sumRange", [0, 0]]]
    expected: [null, 3, null, 8, 3, -1]
  - name: power of two length
    ops: [["NumArray", [[1, 2, 3, 4, 5, 6, 7, 8]]], ["sumRange", [0, 7]], ["sumRange", [3, 5]], ["update", [4, 0]], ["sumRange", [3, 5]], ["sumRange", [0, 7]]]
    expected: [null, 36, 15, null, 10, 31]
  - name: updates from zeros
    ops: [["NumArray", [[0, 0, 0]]], ["update", [0, 1]], ["update", [1, 2]], ["update", [2, 3]], ["sumRange", [0, 2]], ["update", [1, -2]], ["sumRange", [0, 2]], ["sumRange", [1, 1]]]
    expected: [null, null, null, null, 6, null, 2, -2]
  - name: repeated updates to one index
    ops: [["NumArray", [[4, 4, 4, 4, 4]]], ["update", [3, 1]], ["update", [3, 9]], ["update", [3, 9]], ["sumRange", [3, 3]], ["sumRange", [0, 4]], ["sumRange", [1, 3]]]
    expected: [null, null, null, null, 9, 25, 17]
  - name: no update after construction
    ops: [["NumArray", [[2, -2, 7]]], ["sumRange", [0, 1]], ["sumRange", [1, 2]], ["sumRange", [0, 2]]]
    expected: [null, 0, 5, 7]
