    input: {grid: [[0]]}
    expected: 0
  - name: start is the highest cell
    input: {grid: [[3, 0], [1, 2]]}
    expected: 3
  - name: end is the highest cell
    input: {grid: [[0, 1], [2, 3]]}
    expected: 3
  - name: go around a high centre
    input:
      grid:
        - [0, 1, 2]
        - [7, 8, 3]
        - [6, 5, 4]
    expected: 4
  - name: long low corridor beats short high cut
    input:
      grid:
        - [0, 1, 2, 3]
        - [15, 14, 13, 4]
        - [12, 11, 10, 5]
        - [9, 8, 7, 6]
