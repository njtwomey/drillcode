kind: function
entry: Solution.threeSum
scaffolds: []
args: [nums]
compare: unordered_nested
cases:
  - name: example 1
    input: {nums: [-1, 0, 1, 2, -1, -4]}
    expected: [[-1, -1, 2], [-1, 0, 1]]
  - name: example 2 no triplet
    input: {nums: [0, 1, 1]}
    expected: []
  - name: example 3 all zeros
    input: {nums: [0, 0, 0]}
    expected: [[0, 0, 0]]
  - name: many zeros yield one triplet
    input: {nums: [0, 0, 0, 0, 0]}
    expected: [[0, 0, 0]]
  - name: fewer than three elements
    input: {nums: [1, -1]}
    expected: []
  - name: duplicates must not repeat triplets
    input: {nums: [-2, 0, 0, 2, 2]}
    expected: [[-2, 0, 2]]
  - name: all positive
    input: {nums: [1, 2, 3, 4]}
    expected: []
  - name: all negative
    input: {nums: [-5, -3, -1]}
    expected: []
  - name: several triplets with repeats
    input: {nums: [-4, -2, -2, -2, 0, 1, 2, 2, 2, 3, 3, 4, 4, 6, 6]}
    expected: [[-4, -2, 6], [-4, 0, 4], [-4, 1, 3], [-4, 2, 2], [-2, -2, 4], [-2, 0, 2]]
