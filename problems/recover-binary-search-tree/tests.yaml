kind: function
entry: Solution.recoverTree
scaffolds: [tree]
args: [root]
convert:
  root: tree
compare: in_place:root
cases:
  - name: example 1
    input: {root: [1, 3, null, null, 2]}
    expected: [3, 1, null, null, 2]
  - name: example 2
    input: {root: [3, 1, 4, null, null, 2]}
    expected: [2, 1, 4, null, null, 3]
  - name: adjacent swap, single descent
    input: {root: [1, 2, 3]}
    expected: [2, 1, 3]
  - name: adjacent swap deeper
    input: {root: [4, 3, 8, 1, 5, 7, 9]}
    expected: [5, 3, 8, 1, 4, 7, 9]
  - name: swapped leaves far apart
    input: {root: [5, 3, 8, 9, 4, 7, 1]}
    expected: [5, 3, 8, 1, 4, 7, 9]
  - name: root swapped with a deep node
    input: {root: [7, 3, 8, 1, 4, 5, 9]}
    expected: [5, 3, 8, 1, 4, 7, 9]
  - name: two nodes only
    input: {root: [1, 2]}
    expected: [2, 1]
  - name: extreme integer values
    input: {root: [-2147483648, 2147483647]}
    expected: [2147483647, -2147483648]
  - name: right chain, ends swapped
    input: {root: [3, null, 2, null, 1]}
    expected: [1, null, 2, null, 3]
