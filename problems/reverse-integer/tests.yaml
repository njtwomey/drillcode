kind: function
entry: Solution.reverse
scaffolds: []
args: [x]
cases:
  - name: example 1
    input: {x: 123}
    expected: 321
  - name: example 2 negative
    input: {x: -123}
    expected: -321
  - name: example 3 trailing zero
    input: {x: 120}
    expected: 21
  - name: zero
    input: {x: 0}
    expected: 0
  - name: positive overflow
    input: {x: 1534236469}
    expected: 0
  - name: negative overflow
    input: {x: -1563847412}
    expected: 0
  - name: reversed value just fits
    input: {x: 1463847412}
    expected: 2147483641
  - name: minimum int overflows
    input: {x: -2147483648}
    expected: 0
  - name: single digit
    input: {x: -7}
    expected: -7
  - name: many trailing zeros
    input: {x: 1000000000}
    expected: 1
