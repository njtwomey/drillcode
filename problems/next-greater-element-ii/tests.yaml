kind: function
entry: Solution.nextGreaterElements
scaffolds: []
args: [nums]
cases:
  - name: example 1 wraps around
    input: {nums: [1, 2, 1]}
    expected: [2, -1, 2]
  - name: example 2
    input: {nums: [1, 2, 3, 4, 3]}
    expected: [2, 3, 4, -1, 4]
  - name: single element
    input: {nums: [5]}
    expected: [-1]
  - name: all equal
    input: {nums: [2, 2, 2]}
    expected: [-1, -1, -1]
  - name: strictly decreasing
    input: {nums: [5, 4, 3, 2, 1]}
    expected: [-1, 5, 5, 5, 5]
  - name: strictly increasing
    input: {nums: [1, 2, 3, 4]}
    expected: [2, 3, 4, -1]
  - name: mixed
    input: {nums: [3, 8, 4, 1, 2]}
    expected: [8, -1, 8, 2, 3]
  - name: duplicates of the maximum
    input: {nums: [1, 1, 2, 1]}
    expected: [2, 2, -1, 2]
  - name: negatives
    input: {nums: [-5, -3, -4, -1]}
    expected: [-3, -1, -1, -1]
