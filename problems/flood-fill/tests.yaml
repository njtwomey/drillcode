kind: function
entry: Solution.floodFill
scaffolds: []
args: [image, sr, sc, color]
cases:
  - name: example 1
    input: {image: [[1, 1, 1], [1, 1, 0], [1, 0, 1]], sr: 1, sc: 1, color: 2}
    expected: [[2, 2, 2], [2, 2, 0], [2, 0, 1]]
  - name: example 2 start already target colour
    input: {image: [[0, 0, 0], [0, 0, 0]], sr: 0, sc: 0, color: 0}
    expected: [[0, 0, 0], [0, 0, 0]]
  - name: 1x1 image
    input: {image: [[0]], sr: 0, sc: 0, color: 3}
    expected: [[3]]
  - name: diagonal cells are not connected
    input: {image: [[1, 0], [0, 1]], sr: 0, sc: 0, color: 2}
    expected: [[2, 0], [0, 1]]
  - name: snake path
    input: {image: [[1, 1, 1], [0, 0, 1], [1, 1, 1]], sr: 0, sc: 0, color: 5}
    expected: [[5, 5, 5], [0, 0, 5], [5, 5, 5]]
  - name: new colour equals a neighbouring region
    input: {image: [[1, 2], [1, 2]], sr: 0, sc: 0, color: 2}
    expected: [[2, 2], [2, 2]]
  - name: start in a small region
    input: {image: [[0, 0, 0], [0, 1, 0], [0, 0, 0]], sr: 1, sc: 1, color: 7}
    expected: [[0, 0, 0], [0, 7, 0], [0, 0, 0]]
