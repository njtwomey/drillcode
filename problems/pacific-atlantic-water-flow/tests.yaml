kind: function
entry: Solution.pacificAtlantic
scaffolds: []
args: [heights]
compare: unordered
cases:
  - name: example 1
    input: {heights: [[1, 2, 2, 3, 5], [3, 2, 3, 4, 4], [2, 4, 5, 3, 1], [6, 7, 1, 4, 5], [5, 1, 1, 2, 4]]}
    expected: [[0, 4], [1, 3], [1, 4], [2, 2], [3, 0], [3, 1], [4, 0]]
  - name: example 2 single cell
    input: {heights: [[1]]}
    expected: [[0, 0]]
  - name: single row
    input: {heights: [[1, 2, 3]]}
    expected: [[0, 0], [0, 1], [0, 2]]
  - name: single column
    input: {heights: [[3], [1], [2]]}
    expected: [[0, 0], [1, 0], [2, 0]]
  - name: plateau of equal heights
    input: {heights: [[1, 1], [1, 1]]}
    expected: [[0, 0], [0, 1], [1, 0], [1, 1]]
  - name: pit in the middle
    input: {heights: [[3, 3, 3], [3, 1, 3], [0, 2, 4]]}
    expected: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]]
  - name: two by two saddle
    input: {heights: [[2, 1], [1, 2]]}
    expected: [[0, 0], [0, 1], [1, 0], [1, 1]]
