kind: function
entry: Solution.maxDepth
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [3, 9, 20, null, null, 15, 7]}
    expected: 3
  - name: example 2
    input: {root: [1, null, 2]}
    expected: 2
  - name: empty tree
    input: {root: []}
    expected: 0
  - name: single node
    input: {root: [1]}
    expected: 1
  - name: left skewed
    input: {root: [1, 2, null, 3, null, 4]}
    expected: 4
  - name: deepest leaf on the right
    input: {root: [1, 2, 3, null, null, null, 4, null, 5]}
    expected: 4
  - name: complete tree
    input: {root: [1, 2, 3, 4, 5, 6, 7]}
    expected: 3
