kind: function
entry: Solution.pathSum
scaffolds: [tree]
args: [root, targetSum]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [10, 5, -3, 3, 2, null, 11, 3, -2, null, 1], targetSum: 8}
    expected: 3
  - name: example 2
    input: {root: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, 5, 1], targetSum: 22}
    expected: 3
  - name: empty tree
    input: {root: [], targetSum: 0}
    expected: 0
  - name: single node hit
    input: {root: [1], targetSum: 1}
    expected: 1
  - name: single node miss
    input: {root: [1], targetSum: 0}
    expected: 0
  - name: zeros count every downward path
    input: {root: [0, 0, 0], targetSum: 0}
    expected: 5
  - name: negatives with non-root starts
    input: {root: [1, -2, -3, 1, 3, -2, null, -1], targetSum: -1}
    expected: 4
  - name: skewed chain with mid-chain paths
    input: {root: [1, null, 2, null, 3, null, 4, null, 5], targetSum: 9}
    expected: 2
  - name: siblings must not share prefix counts
    input: {root: [0, 1, 1], targetSum: 1}
    expected: 4
  - name: large values stay exact
    input: {root: [1000000000, 1000000000, null, 294967296, null, 1000000000, null, 1000000000, null, 1000000000], targetSum: 0}
    expected: 0
