kind: function
entry: Solution.kthSmallest
scaffolds: []
args: [matrix, k]
cases:
  - name: example 1
    input: {matrix: [[1, 5, 9], [10, 11, 13], [12, 13, 15]], k: 8}
    expected: 13
  - name: example 2 single cell
    input: {matrix: [[-5]], k: 1}
    expected: -5
  - name: duplicates count separately
    input: {matrix: [[1, 1], [1, 2]], k: 3}
    expected: 1
  - name: all equal
    input: {matrix: [[7, 7, 7], [7, 7, 7], [7, 7, 7]], k: 9}
    expected: 7
  - name: k is one
    input: {matrix: [[1, 2], [1, 3]], k: 1}
    expected: 1
  - name: k is n squared
    input: {matrix: [[1, 5, 9], [10, 11, 13], [12, 13, 15]], k: 9}
    expected: 15
  - name: second row interleaves with first
    input: {matrix: [[1, 3, 5], [2, 4, 6], [7, 8, 9]], k: 5}
    expected: 5
  - name: negative values
    input: {matrix: [[-10, -4], [-9, 0]], k: 3}
    expected: -4
