kind: function
entry: Solution.eraseOverlapIntervals
scaffolds: []
args: [intervals]
cases:
  - name: example 1
    input: {intervals: [[1, 2], [2, 3], [3, 4], [1, 3]]}
    expected: 1
  - name: example 2 duplicates
    input: {intervals: [[1, 2], [1, 2], [1, 2]]}
    expected: 2
  - name: example 3 touching only
    input: {intervals: [[1, 2], [2, 3]]}
    expected: 0
  - name: single interval
    input: {intervals: [[1, 5]]}
    expected: 0
  - name: sorting by start fails here
    input: {intervals: [[1, 100], [11, 22], [1, 11], [2, 12]]}
    expected: 2
  - name: chain of overlaps
    input: {intervals: [[0, 2], [1, 3], [2, 4], [3, 5], [4, 6]]}
    expected: 2
  - name: negative values disjoint
    input: {intervals: [[-100, -2], [5, 7]]}
    expected: 0
  - name: one interval covers all
    input: {intervals: [[1, 10], [2, 3], [4, 5], [6, 7]]}
    expected: 1
