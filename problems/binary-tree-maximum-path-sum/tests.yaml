kind: function
entry: Solution.maxPathSum
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [1, 2, 3]}
    expected: 6
  - name: example 2
    input: {root: [-10, 9, 20, null, null, 15, 7]}
    expected: 42
  - name: single node
    input: {root: [-3]}
    expected: -3
  - name: all negative
    input: {root: [-3, -2, -1]}
    expected: -1
  - name: negative child dropped
    input: {root: [2, -1]}
    expected: 2
  - name: path may not branch twice
    input: {root: [1, 2, 3, 4, 5]}
    expected: 11
  - name: path avoids the root
    input: {root: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, null, 1]}
    expected: 48
  - name: negative root bridging two subtrees
    input: {root: [-1, 5, 6]}
    expected: 10
