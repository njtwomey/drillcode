kind: function
entry: Solution.medianSlidingWindow
scaffolds: []
args: [nums, k]
compare: float:0.00001
cases:
  - name: example 1
    input: {nums: [1, 3, -1, -3, 5, 3, 6, 7], k: 3}
    expected: [1, -1, -1, 3, 5, 6]
  - name: example 2 duplicates
    input: {nums: [1, 2, 3, 4, 2, 3, 1, 4, 2], k: 3}
    expected: [2, 3, 3, 3, 2, 3, 2]
  - name: window size one
    input: {nums: [5, 2, 3], k: 1}
    expected: [5, 2, 3]
  - name: window size two averages
    input: {nums: [1, 4, 2, 3], k: 2}
    expected: [2.5, 3, 2.5]
  - name: window equals the array, even
    input: {nums: [1, 2, 3, 4], k: 4}
    expected: [2.5]
  - name: single element
    input: {nums: [7], k: 1}
    expected: [7]
  - name: no overflow near the int limit
    input: {nums: [2147483647, 2147483647], k: 2}
    expected: [2147483647]
  - name: all equal values
    input: {nums: [1, 1, 1, 1], k: 2}
    expected: [1, 1, 1]
  - name: negatives with even window
    input: {nums: [-5, -1, -3], k: 2}
    expected: [-3, -2]
