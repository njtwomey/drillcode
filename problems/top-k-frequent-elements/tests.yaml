kind: function
entry: Solution.topKFrequent
scaffolds: []
args: [nums, k]
compare: unordered
cases:
  - name: example 1
    input: {nums: [1, 1, 1, 2, 2, 3], k: 2}
    expected: [1, 2]
  - name: example 2
    input: {nums: [1], k: 1}
    expected: [1]
  - name: k equals distinct count
    input: {nums: [4, 4, 5, 6, 6, 6], k: 3}
    expected: [4, 5, 6]
  - name: all identical
    input: {nums: [7, 7, 7], k: 1}
    expected: [7]
  - name: negatives
    input: {nums: [-1, -1, -1, 2, 2, 3], k: 2}
    expected: [-1, 2]
  - name: k is one
    input: {nums: [1, 2, 2, 3, 3, 3], k: 1}
    expected: [3]
  - name: many singletons beyond top two
    input: {nums: [5, 3, 1, 1, 1, 3, 73, 1], k: 2}
    expected: [1, 3]
  - name: most frequent appears last
    input: {nums: [1, 2, 3, 4, 4, 4, 4, 3, 3], k: 2}
    expected: [4, 3]
