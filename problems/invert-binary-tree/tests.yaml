kind: function
entry: Solution.invertTree
scaffolds: [tree]
args: [root]
convert:
  root: tree
  result: tree
cases:
  - name: example 1
    input: {root: [4, 2, 7, 1, 3, 6, 9]}
    expected: [4, 7, 2, 9, 6, 3, 1]
  - name: example 2
    input: {root: [2, 1, 3]}
    expected: [2, 3, 1]
  - name: empty tree
    input: {root: []}
    expected: []
  - name: single node
    input: {root: [1]}
    expected: [1]
  - name: left child only
    input: {root: [1, 2]}
    expected: [1, null, 2]
  - name: right child only
    input: {root: [1, null, 2]}
    expected: [1, 2]
  - name: asymmetric subtrees
    input: {root: [1, 2, 3, 4, 5]}
    expected: [1, 3, 2, null, null, 5, 4]
