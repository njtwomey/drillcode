kind: function
entry: Solution.subsetsWithDup
scaffolds: []
args: [nums]
compare: unordered_nested
cases:
  - name: example 1
    input: {nums: [1, 2, 2]}
    expected: [[], [1], [1, 2], [1, 2, 2], [2], [2, 2]]
  - name: example 2 single element
    input: {nums: [0]}
    expected: [[], [0]]
  - name: all equal
    input: {nums: [1, 1, 1]}
    expected: [[], [1], [1, 1], [1, 1, 1]]
  - name: unsorted input
    input: {nums: [2, 1, 2]}
    expected: [[], [1], [1, 2], [1, 2, 2], [2], [2, 2]]
  - name: duplicates in two values
    input: {nums: [1, 2, 2, 3]}
    expected: [[], [1], [2], [2, 2], [3], [1, 2], [1, 2, 2], [1, 3], [2, 3], [2, 2, 3], [1, 2, 3], [1, 2, 2, 3]]
  - name: one value repeated with a distinct one
    input: {nums: [4, 4, 4, 1, 4]}
    expected: [[], [4], [4, 4], [4, 4, 4], [4, 4, 4, 4], [1], [1, 4], [1, 4, 4], [1, 4, 4, 4], [1, 4, 4, 4, 4]]
  - name: negatives
    input: {nums: [-1, -1, 2]}
    expected: [[], [-1], [-1, -1], [2], [-1, 2], [-1, -1, 2]]
