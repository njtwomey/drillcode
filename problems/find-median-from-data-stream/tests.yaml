kind: operations
entry: MedianFinder
scaffolds: []
compare: float:0.00001
cases:
  - name: example 1
    ops: [["MedianFinder", []], ["addNum", [1]], ["addNum", [2]], ["findMedian", []], ["addNum", [3]], ["findMedian", []]]
    expected: [null, null, null, 1.5, null, 2.0]
  - name: single element
    ops: [["MedianFinder", []], ["addNum", [5]], ["findMedian", []]]
    expected: [null, null, 5.0]
  - name: many duplicates
    ops: [["MedianFinder", []], ["addNum", [2]], ["addNum", [2]], ["addNum", [2]], ["addNum", [2]], ["findMedian", []], ["addNum", [2]], ["findMedian", []]]
    expected: [null, null, null, null, null, 2.0, null, 2.0]
  - name: descending insertion
    ops: [["MedianFinder", []], ["addNum", [5]], ["addNum", [4]], ["findMedian", []], ["addNum", [3]], ["findMedian", []], ["addNum", [2]], ["findMedian", []], ["addNum", [1]], ["findMedian", []]]
    expected: [null, null, null, 4.5, null, 4.0, null, 3.5, null, 3.0]
  - name: negatives and zero
    ops: [["MedianFinder", []], ["addNum", [-1]], ["findMedian", []], ["addNum", [-2]], ["findMedian", []], ["addNum", [-3]], ["findMedian", []], ["addNum", [0]], ["findMedian", []]]
    expected: [null, null, -1.0, null, -1.5, null, -2.0, null, -1.5]
  - name: new value lands in the other half
    ops: [["MedianFinder", []], ["addNum", [10]], ["addNum", [1]], ["addNum", [100]], ["findMedian", []], ["addNum", [50]], ["findMedian", []], ["addNum", [2]], ["findMedian", []]]
    expected: [null, null, null, null, 10.0, null, 30.0, null, 10.0]
  - name: large values
    ops: [["MedianFinder", []], ["addNum", [100000]], ["addNum", [99999]], ["findMedian", []]]
    expected: [null, null, null, 99999.5]
