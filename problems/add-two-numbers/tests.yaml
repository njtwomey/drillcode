kind: function
entry: Solution.addTwoNumbers
scaffolds: [linked_list]
args: [l1, l2]
convert:
  l1: linked_list
  l2: linked_list
  result: linked_list
cases:
  - name: example 1
    input: {l1: [2, 4, 3], l2: [5, 6, 4]}
    expected: [7, 0, 8]
  - name: example 2 zeros
    input: {l1: [0], l2: [0]}
    expected: [0]
  - name: example 3 long carry chain
    input: {l1: [9, 9, 9, 9, 9, 9, 9], l2: [9, 9, 9, 9]}
    expected: [8, 9, 9, 9, 0, 0, 0, 1]
  - name: final carry adds a node
    input: {l1: [5], l2: [5]}
    expected: [0, 1]
  - name: first longer
    input: {l1: [1, 2, 3, 4], l2: [9]}
    expected: [0, 3, 3, 4]
  - name: second longer
    input: {l1: [9], l2: [1, 2, 3, 4]}
    expected: [0, 3, 3, 4]
  - name: carry propagates past shorter list
    input: {l1: [1], l2: [9, 9, 9]}
    expected: [0, 0, 0, 1]
