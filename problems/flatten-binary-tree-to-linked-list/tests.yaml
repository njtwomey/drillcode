kind: function
entry: Solution.flatten
scaffolds: [tree]
args: [root]
convert:
  root: tree
compare: in_place:root
cases:
  - name: example 1
    input: {root: [1, 2, 5, 3, 4, null, 6]}
    expected: [1, null, 2, null, 3, null, 4, null, 5, null, 6]
  - name: example 2 empty tree
    input: {root: []}
    expected: []
  - name: example 3 single node
    input: {root: [0]}
    expected: [0]
  - name: left skewed chain
    input: {root: [1, 2, null, 3]}
    expected: [1, null, 2, null, 3]
  - name: already flat
    input: {root: [1, null, 2, null, 3]}
    expected: [1, null, 2, null, 3]
  - name: two leaf children
    input: {root: [1, 2, 3]}
    expected: [1, null, 2, null, 3]
  - name: left child with only a right child
    input: {root: [1, 2, null, null, 3]}
    expected: [1, null, 2, null, 3]
  - name: left subtree before right
    input: {root: [3, 1, 4, null, 2]}
    expected: [3, null, 1, null, 2, null, 4]
  - name: perfect tree of seven
    input: {root: [1, 2, 3, 4, 5, 6, 7]}
    expected: [1, null, 2, null, 4, null, 5, null, 3, null, 6, null, 7]
