kind: function
entry: Solution.coinChange
scaffolds: []
args: [coins, amount]
cases:
  - name: example 1
    input: {coins: [1, 2, 5], amount: 11}
    expected: 3
  - name: example 2 impossible
    input: {coins: [2], amount: 3}
    expected: -1
  - name: example 3 amount zero
    input: {coins: [1], amount: 0}
    expected: 0
  - name: every coin larger than amount
    input: {coins: [5, 10], amount: 3}
    expected: -1
  - name: greedy fails
    input: {coins: [1, 3, 4], amount: 6}
    expected: 2
  - name: greedy fails again
    input: {coins: [186, 419, 83, 408], amount: 6249}
    expected: 20
  - name: amount equals a coin
    input: {coins: [7, 3], amount: 7}
    expected: 1
  - name: large amount single coin
    input: {coins: [1], amount: 10000}
    expected: 10000
  - name: zero amount with big coin
    input: {coins: [5], amount: 0}
    expected: 0
