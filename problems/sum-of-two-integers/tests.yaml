kind: function
entry: Solution.getSum
scaffolds: []
args: [a, b]
cases:
  - name: example 1
    input: {a: 1, b: 2}
    expected: 3
  - name: example 2
    input: {a: 2, b: 3}
    expected: 5
  - name: both zero
    input: {a: 0, b: 0}
    expected: 0
  - name: sums to zero
    input: {a: 5, b: -5}
    expected: 0
  - name: negative plus positive
    input: {a: -2, b: 3}
    expected: 1
  - name: positive plus larger negative
    input: {a: 3, b: -5}
    expected: -2
  - name: both negative
    input: {a: -3, b: -4}
    expected: -7
  - name: carries propagate
    input: {a: 15, b: 1}
    expected: 16
  - name: bounds
    input: {a: -1000, b: 1000}
    expected: 0
  - name: bounds negative
    input: {a: -1000, b: -1000}
    expected: -2000
