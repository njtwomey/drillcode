kind: function
entry: Solution.reorderList
scaffolds: [linked_list]
args: [head]
convert:
  head: linked_list
compare: in_place:head
cases:
  - name: example 1 even length
    input: {head: [1, 2, 3, 4]}
    expected: [1, 4, 2, 3]
  - name: example 2 odd length
    input: {head: [1, 2, 3, 4, 5]}
    expected: [1, 5, 2, 4, 3]
  - name: single node
    input: {head: [1]}
    expected: [1]
  - name: two nodes
    input: {head: [1, 2]}
    expected: [1, 2]
  - name: three nodes
    input: {head: [1, 2, 3]}
    expected: [1, 3, 2]
  - name: six nodes
    input: {head: [1, 2, 3, 4, 5, 6]}
    expected: [1, 6, 2, 5, 3, 4]
  - name: duplicate values
    input: {head: [5, 5, 6, 6]}
    expected: [5, 6, 5, 6]
