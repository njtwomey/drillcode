kind: function
entry: Solution.minPathSum
scaffolds: []
args: [grid]
cases:
  - name: example 1
    input: {grid: [[1, 3, 1], [1, 5, 1], [4, 2, 1]]}
    expected: 7
  - name: example 2
    input: {grid: [[1, 2, 3], [4, 5, 6]]}
    expected: 12
  - name: single cell
    input: {grid: [[5]]}
    expected: 5
  - name: single row
    input: {grid: [[1, 2, 3]]}
    expected: 6
  - name: single column
    input: {grid: [[1], [2], [3]]}
    expected: 6
  - name: all zeros
    input: {grid: [[0, 0], [0, 0]]}
    expected: 0
  - name: zigzag around expensive cells
    input: {grid: [[1, 10, 1], [1, 1, 100], [100, 1, 1]]}
    expected: 5
  - name: small 2x3
    input: {grid: [[1, 2, 5], [3, 4, 1]]}
    expected: 8
  - name: cheap cell hides a trap
    input: {grid: [[1, 2, 100], [3, 100, 1], [100, 100, 1]]}
    expected: 105
