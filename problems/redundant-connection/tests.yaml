kind: function
entry: Solution.findRedundantConnection
scaffolds: []
args: [edges]
cases:
  - name: example 1 triangle
    input: {edges: [[1, 2], [1, 3], [2, 3]]}
    expected: [2, 3]
  - name: example 2 cycle with a tail
    input: {edges: [[1, 2], [2, 3], [3, 4], [1, 4], [1, 5]]}
    expected: [1, 4]
  - name: closing edge is not the last one given
    input: {edges: [[1, 2], [2, 3], [3, 1], [3, 4]]}
    expected: [3, 1]
  - name: two chains joined by the cycle edge
    input: {edges: [[1, 2], [3, 4], [2, 3], [1, 4]]}
    expected: [1, 4]
  - name: triangle given in another order
    input: {edges: [[1, 2], [2, 3], [1, 3]]}
    expected: [1, 3]
  - name: larger graph
    input: {edges: [[2, 7], [7, 8], [3, 6], [2, 5], [6, 8], [4, 8], [2, 8], [1, 8], [7, 10], [3, 9]]}
    expected: [2, 8]
  - name: cycle closes on the final edge
    input: {edges: [[1, 2], [2, 3], [3, 4], [4, 1]]}
    expected: [4, 1]
