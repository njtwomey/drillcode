kind: operations
entry: DetectSquares
scaffolds: []
cases:
  - name: example 1
    ops: [["DetectSquares", []], ["add", [[3, 10]]], ["add", [[11, 2]]], ["add", [[3, 2]]], ["count", [[11, 10]]], ["count", [[14, 8]]], ["add", [[11, 2]]], ["count", [[11, 10]]]]
    expected: [null, null, null, null, 1, 0, null, 2]
  - name: count before any add
    ops: [["DetectSquares", []], ["count", [[5, 5]]]]
    expected: [null, 0]
  - name: duplicate points multiply
    ops: [["DetectSquares", []], ["add", [[1, 0]]], ["add", [[1, 1]]], ["add", [[0, 0]]], ["add", [[0, 0]]], ["count", [[0, 1]]]]
    expected: [null, null, null, null, null, 2]
  - name: zero area is not a square
    ops: [["DetectSquares", []], ["add", [[5, 5]]], ["count", [[5, 5]]]]
    expected: [null, null, 0]
  - name: squares on both sides of the query
    ops: [["DetectSquares", []], ["add", [[0, 0]]], ["add", [[1, 0]]], ["add", [[0, 1]]], ["add", [[2, 2]]], ["add", [[1, 2]]], ["add", [[2, 1]]], ["count", [[1, 1]]]]
    expected: [null, null, null, null, null, null, null, 2]
  - name: rectangle that is not a square
    ops: [["DetectSquares", []], ["add", [[0, 0]]], ["add", [[0, 2]]], ["add", [[1, 0]]], ["count", [[1, 2]]]]
    expected: [null, null, null, null, 0]
  - name: query does not add the point
    ops: [["DetectSquares", []], ["add", [[0, 0]]], ["add", [[0, 1]]], ["add", [[1, 0]]], ["count", [[1, 1]]], ["count", [[1, 1]]]]
    expected: [null, null, null, null, 1, 1]
  - name: larger square and a different size
    ops: [["DetectSquares", []], ["add", [[0, 0]]], ["add", [[0, 5]]], ["add", [[5, 0]]], ["add", [[5, 3]]], ["count", [[5, 5]]], ["count", [[0, 3]]]]
    expected: [null, null, null, null, null, 1, 0]
