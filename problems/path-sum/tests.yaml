kind: function
entry: Solution.hasPathSum
scaffolds: [tree]
args: [root, targetSum]
convert:
  root: tree
cases:
  - name: example 1 path exists
    input: {root: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, null, 1], targetSum: 22}
    expected: true
  - name: example 2 no path
    input: {root: [1, 2, 3], targetSum: 5}
    expected: false
  - name: example 3 empty tree
    input: {root: [], targetSum: 0}
    expected: false
  - name: single node match
    input: {root: [1], targetSum: 1}
    expected: true
  - name: single node mismatch
    input: {root: [1], targetSum: 2}
    expected: false
  - name: non-leaf prefix does not count
    input: {root: [1, 2], targetSum: 1}
    expected: false
  - name: negative values
    input: {root: [-2, null, -3], targetSum: -5}
    expected: true
  - name: right-hand leaf
    input: {root: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, null, 1], targetSum: 26}
    expected: true
  - name: left skewed chain
    input: {root: [1, 2, null, 3], targetSum: 6}
    expected: true
