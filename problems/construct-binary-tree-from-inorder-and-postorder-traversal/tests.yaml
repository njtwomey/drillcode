kind: function
entry: Solution.buildTree
scaffolds: [tree]
args: [inorder, postorder]
convert:
  result: tree
cases:
  - name: example 1
    input: {inorder: [9, 3, 15, 20, 7], postorder: [9, 15, 7, 20, 3]}
    expected: [3, 9, 20, null, null, 15, 7]
  - name: example 2 single node
    input: {inorder: [-1], postorder: [-1]}
    expected: [-1]
  - name: fully left skewed
    input: {inorder: [3, 2, 1], postorder: [3, 2, 1]}
    expected: [1, 2, null, 3]
  - name: fully right skewed
    input: {inorder: [1, 2, 3], postorder: [3, 2, 1]}
    expected: [1, null, 2, null, 3]
  - name: perfect tree of seven
    input: {inorder: [4, 2, 5, 1, 6, 3, 7], postorder: [4, 5, 2, 6, 7, 3, 1]}
    expected: [1, 2, 3, 4, 5, 6, 7]
  - name: left child with right grandchild
    input: {inorder: [2, 3, 1], postorder: [3, 2, 1]}
    expected: [1, 2, null, null, 3]
  - name: right child with left grandchild
    input: {inorder: [1, 3, 2], postorder: [3, 2, 1]}
    expected: [1, null, 2, 3]
  - name: negative values with zero root
    input: {inorder: [-1, 0, 1], postorder: [-1, 1, 0]}
    expected: [0, -1, 1]
  - name: unsorted values
    input: {inorder: [7, 4, 9, 1, 8], postorder: [7, 9, 4, 8, 1]}
    expected: [1, 4, 8, 7, 9]
