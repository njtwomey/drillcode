kind: function
entry: Solution.isNStraightHand
scaffolds: []
args: [hand, groupSize]
cases:
  - name: example 1
    input: {hand: [1, 2, 3, 6, 2, 3, 4, 7, 8], groupSize: 3}
    expected: true
  - name: example 2 size not divisible
    input: {hand: [1, 2, 3, 4, 5], groupSize: 4}
    expected: false
  - name: group size one
    input: {hand: [5, 1, 9, 1], groupSize: 1}
    expected: true
  - name: gap between values
    input: {hand: [1, 3, 2, 5], groupSize: 2}
    expected: false
  - name: duplicates start overlapping runs
    input: {hand: [1, 1, 2, 2, 3, 3], groupSize: 3}
    expected: true
  - name: duplicate cannot extend
    input: {hand: [1, 1, 2, 3], groupSize: 2}
    expected: false
  - name: runs overlap in the middle
    input: {hand: [1, 2, 3, 3, 4, 4, 5, 6], groupSize: 4}
    expected: true
  - name: not consecutive
    input: {hand: [8, 10, 12], groupSize: 3}
    expected: false
  - name: one big group unsorted
    input: {hand: [4, 2, 5, 3, 1], groupSize: 5}
    expected: true
  - name: large values
    input: {hand: [1000000000, 999999999, 999999998, 1000000000, 999999999, 999999998], groupSize: 3}
    expected: true
