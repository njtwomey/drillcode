kind: function
entry: Solution.findDisappearedNumbers
scaffolds: []
args: [nums]
compare: unordered
cases:
  - name: example 1
    input: {nums: [4, 3, 2, 7, 8, 2, 3, 1]}
    expected: [5, 6]
  - name: example 2
    input: {nums: [1, 1]}
    expected: [2]
  - name: single element
    input: {nums: [1]}
    expected: []
  - name: permutation has none missing
    input: {nums: [3, 1, 2]}
    expected: []
  - name: repeated value hits an already marked slot
    input: {nums: [2, 2, 2, 2]}
    expected: [1, 3, 4]
  - name: all the same large value
    input: {nums: [5, 5, 5, 5, 5]}
    expected: [1, 2, 3, 4]
  - name: all ones
    input: {nums: [1, 1, 1, 1]}
    expected: [2, 3, 4]
  - name: duplicates at both ends
    input: {nums: [1, 6, 6, 3, 1, 5]}
    expected: [2, 4]
