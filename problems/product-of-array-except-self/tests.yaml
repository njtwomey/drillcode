kind: function
entry: Solution.productExceptSelf
scaffolds: []
args: [nums]
cases:
  - name: example 1
    input: {nums: [1, 2, 3, 4]}
    expected: [24, 12, 8, 6]
  - name: example 2 with zero
    input: {nums: [-1, 1, 0, -3, 3]}
    expected: [0, 0, 9, 0, 0]
  - name: one zero
    input: {nums: [1, 0, 3]}
    expected: [0, 3, 0]
  - name: two zeros
    input: {nums: [0, 0, 2]}
    expected: [0, 0, 0]
  - name: negative numbers
    input: {nums: [-1, -2, -3]}
    expected: [6, 3, 2]
  - name: two elements
    input: {nums: [3, 4]}
    expected: [4, 3]
  - name: zero at the end
    input: {nums: [2, 0]}
    expected: [0, 2]
