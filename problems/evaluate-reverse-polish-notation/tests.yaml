kind: function
entry: Solution.evalRPN
scaffolds: []
args: [tokens]
cases:
  - name: example 1
    input: {tokens: ["2", "1", "+", "3", "*"]}
    expected: 9
  - name: example 2
    input: {tokens: ["4", "13", "5", "/", "+"]}
    expected: 6
  - name: example 3
    input: {tokens: ["10", "6", "9", "3", "+", "-11", "*", "/", "*", "17", "+", "5", "+"]}
    expected: 22
  - name: single token
    input: {tokens: ["3"]}
    expected: 3
  - name: single negative token
    input: {tokens: ["-5"]}
    expected: -5
  - name: subtraction operand order
    input: {tokens: ["3", "4", "-"]}
    expected: -1
  - name: division by a larger negative truncates to zero
    input: {tokens: ["6", "-132", "/"]}
    expected: 0
  - name: negative dividend truncates toward zero
    input: {tokens: ["-7", "2", "/"]}
    expected: -3
  - name: negative divisor truncates toward zero
    input: {tokens: ["7", "-2", "/"]}
    expected: -3
  - name: zero dividend
    input: {tokens: ["0", "3", "/"]}
    expected: 0
