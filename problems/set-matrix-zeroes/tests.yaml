kind: function
entry: Solution.setZeroes
scaffolds: []
args: [matrix]
compare: in_place:matrix
cases:
  - name: example 1
    input: {matrix: [[1, 1, 1], [1, 0, 1], [1, 1, 1]]}
    expected: [[1, 0, 1], [0, 0, 0], [1, 0, 1]]
  - name: example 2
    input: {matrix: [[0, 1, 2, 0], [3, 4, 5, 2], [1, 3, 1, 5]]}
    expected: [[0, 0, 0, 0], [0, 4, 5, 0], [0, 3, 1, 0]]
  - name: 1x1 zero
    input: {matrix: [[0]]}
    expected: [[0]]
  - name: 1x1 nonzero
    input: {matrix: [[7]]}
    expected: [[7]]
  - name: all zeros
    input: {matrix: [[0, 0], [0, 0]]}
    expected: [[0, 0], [0, 0]]
  - name: zero only in first column
    input: {matrix: [[1, 2, 3], [0, 5, 6], [7, 8, 9]]}
    expected: [[0, 2, 3], [0, 0, 0], [0, 8, 9]]
  - name: zero only in first row
    input: {matrix: [[1, 0, 3], [4, 5, 6], [7, 8, 9]]}
    expected: [[0, 0, 0], [4, 0, 6], [7, 0, 9]]
  - name: single row
    input: {matrix: [[1, 0, 3]]}
    expected: [[0, 0, 0]]
  - name: single column
    input: {matrix: [[1], [0], [3]]}
    expected: [[0], [0], [0]]
  - name: no zeros and negatives
    input: {matrix: [[-1, 2], [3, -4]]}
    expected: [[-1, 2], [3, -4]]
  - name: zero in the bottom-right corner
    input: {matrix: [[1, 2, 3], [4, 5, 6], [7, 8, 0]]}
    expected: [[1, 2, 0], [4, 5, 0], [0, 0, 0]]
