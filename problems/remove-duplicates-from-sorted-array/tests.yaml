kind: function
entry: Solution.removeDuplicates
scaffolds: []
args: [nums]
compare: validator
cases:
  - name: example 1
    input: {nums: [1, 1, 2]}
    expected: 2
  - name: example 2
    input: {nums: [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]}
    expected: 5
  - name: single element
    input: {nums: [7]}
    expected: 1
  - name: all equal
    input: {nums: [4, 4, 4, 4, 4]}
    expected: 1
  - name: already unique
    input: {nums: [1, 2, 3, 4, 5]}
    expected: 5
  - name: negatives
    input: {nums: [-3, -3, -1, -1, 0, 0, 2]}
    expected: 4
  - name: two equal elements
    input: {nums: [2, 2]}
    expected: 1
  - name: duplicates only at the end
    input: {nums: [1, 2, 3, 3, 3]}
    expected: 3
