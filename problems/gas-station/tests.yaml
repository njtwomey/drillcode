kind: function
entry: Solution.canCompleteCircuit
scaffolds: []
args: [gas, cost]
cases:
  - name: example 1
    input: {gas: [1, 2, 3, 4, 5], cost: [3, 4, 5, 1, 2]}
    expected: 3
  - name: example 2 impossible
    input: {gas: [2, 3, 4], cost: [3, 4, 3]}
    expected: -1
  - name: single station enough
    input: {gas: [5], cost: [4]}
    expected: 0
  - name: single station short
    input: {gas: [4], cost: [5]}
    expected: -1
  - name: total exactly equal, start at the end
    input: {gas: [1, 1, 3], cost: [2, 2, 1]}
    expected: 2
  - name: start is not the richest station
    input: {gas: [5, 1, 2, 3, 4], cost: [4, 4, 1, 5, 1]}
    expected: 4
  - name: start at zero
    input: {gas: [3, 1, 1], cost: [1, 2, 2]}
    expected: 0
  - name: surplus too small elsewhere
    input: {gas: [1, 2, 3], cost: [2, 3, 2]}
    expected: -1
