kind: function
entry: Solution.isValidBST
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [2, 1, 3]}
    expected: true
  - name: example 2
    input: {root: [5, 1, 4, null, null, 3, 6]}
    expected: false
  - name: single node
    input: {root: [1]}
    expected: true
  - name: grandchild violates ancestor bound
    input: {root: [5, 4, 6, null, null, 3, 7]}
    expected: false
  - name: duplicate on the left
    input: {root: [2, 2, 3]}
    expected: false
  - name: duplicate on the right
    input: {root: [2, 1, 2]}
    expected: false
  - name: max int value
    input: {root: [2147483647]}
    expected: true
  - name: min and max int
    input: {root: [0, -2147483648, 2147483647]}
    expected: true
  - name: duplicate max int child
    input: {root: [2147483647, 2147483647]}
    expected: false
  - name: deep valid
    input: {root: [8, 4, 12, 2, 6, 10, 14, 1, 3, 5, 7, 9, 11, 13, 15]}
    expected: true
  - name: left subtree has right descendant too large
    input: {root: [10, 5, 15, null, null, 6, 20]}
    expected: false
