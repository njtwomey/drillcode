kind: function
entry: Solution.kthSmallest
scaffolds: [tree]
args: [root, k]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [3, 1, 4, null, 2], k: 1}
    expected: 1
  - name: example 2
    input: {root: [5, 3, 6, 2, 4, null, null, 1], k: 3}
    expected: 3
  - name: single node
    input: {root: [1], k: 1}
    expected: 1
  - name: k = n (rightmost)
    input: {root: [5, 3, 6, 2, 4, null, null, 1], k: 6}
    expected: 6
  - name: k = 1 (leftmost, deep)
    input: {root: [5, 3, 6, 2, 4, null, null, 1], k: 1}
    expected: 1
  - name: right skewed
    input: {root: [1, null, 2, null, 3], k: 2}
    expected: 2
  - name: root is the answer
    input: {root: [2, 1, 3], k: 2}
    expected: 2
  - name: left skewed
    input: {root: [3, 2, null, 1], k: 3}
    expected: 3
