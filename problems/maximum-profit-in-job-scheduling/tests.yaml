kind: function
entry: Solution.jobScheduling
scaffolds: []
args: [startTime, endTime, profit]
cases:
  - name: example 1
    input: {startTime: [1, 2, 3, 3], endTime: [3, 4, 5, 6], profit: [50, 10, 40, 70]}
    expected: 120
  - name: example 2
    input: {startTime: [1, 2, 3, 4, 6], endTime: [3, 5, 10, 6, 9], profit: [20, 20, 100, 70, 60]}
    expected: 150
  - name: example 3 same start
    input: {startTime: [1, 1, 1], endTime: [2, 3, 4], profit: [5, 6, 4]}
    expected: 6
  - name: single job
    input: {startTime: [1], endTime: [2], profit: [7]}
    expected: 7
  - name: touching jobs can both run
    input: {startTime: [1, 3], endTime: [3, 5], profit: [5, 6]}
    expected: 11
  - name: overlapping jobs pick the better
    input: {startTime: [1, 2], endTime: [3, 4], profit: [5, 6]}
    expected: 6
  - name: one big job beats a chain
    input: {startTime: [1, 2, 4], endTime: [10, 3, 5], profit: [100, 10, 10]}
    expected: 100
  - name: same end time
    input: {startTime: [1, 2], endTime: [5, 5], profit: [3, 4]}
    expected: 4
  - name: unsorted input
    input: {startTime: [6, 1, 3], endTime: [8, 4, 6], profit: [5, 2, 4]}
    expected: 9
  - name: chain beats a big job
    input: {startTime: [1, 1, 3, 5], endTime: [10, 3, 5, 10], profit: [15, 6, 6, 6]}
    expected: 18
