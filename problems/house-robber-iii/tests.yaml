kind: function
entry: Solution.rob
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [3, 2, 3, null, 3, null, 1]}
    expected: 7
  - name: example 2
    input: {root: [3, 4, 5, 1, 3, null, 1]}
    expected: 9
  - name: single node
    input: {root: [1]}
    expected: 1
  - name: root outweighs children
    input: {root: [10, 1, 1]}
    expected: 10
  - name: children outweigh root
    input: {root: [1, 4, 5]}
    expected: 9
  - name: skewed chain skips two in a row
    input: {root: [2, 1, null, 3, null, 4]}
    expected: 6
  - name: root and grandchildren
    input: {root: [5, 1, 1, 9, null, null, 9]}
    expected: 23
  - name: choice differs per branch
    input: {root: [1, 10, 1, 1, 1, null, 10]}
    expected: 20
  - name: zero-valued node
    input: {root: [0]}
    expected: 0
