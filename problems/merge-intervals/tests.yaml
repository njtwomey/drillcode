kind: function
entry: Solution.merge
scaffolds: []
args: [intervals]
cases:
  - name: example 1
    input: {intervals: [[1, 3], [2, 6], [8, 10], [15, 18]]}
    expected: [[1, 6], [8, 10], [15, 18]]
  - name: example 2 touching intervals
    input: {intervals: [[1, 4], [4, 5]]}
    expected: [[1, 5]]
  - name: example 3 unsorted touching
    input: {intervals: [[4, 7], [1, 4]]}
    expected: [[1, 7]]
  - name: single interval
    input: {intervals: [[1, 4]]}
    expected: [[1, 4]]
  - name: one inside another keeps the larger end
    input: {intervals: [[1, 4], [2, 3]]}
    expected: [[1, 4]]
  - name: nested then more
    input: {intervals: [[1, 10], [2, 3], [4, 5]]}
    expected: [[1, 10]]
  - name: unsorted input
    input: {intervals: [[8, 10], [1, 3], [2, 6]]}
    expected: [[1, 6], [8, 10]]
  - name: zero length interval
    input: {intervals: [[1, 4], [0, 0]]}
    expected: [[0, 0], [1, 4]]
  - name: last interval swallows everything
    input: {intervals: [[2, 3], [4, 5], [6, 7], [8, 9], [1, 10]]}
    expected: [[1, 10]]
