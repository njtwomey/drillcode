kind: function
entry: Solution.sortColors
scaffolds: []
args: [nums]
compare: in_place:nums
cases:
  - name: example 1
    input: {nums: [2, 0, 2, 1, 1, 0]}
    expected: [0, 0, 1, 1, 2, 2]
  - name: example 2
    input: {nums: [2, 0, 1]}
    expected: [0, 1, 2]
  - name: single element
    input: {nums: [0]}
    expected: [0]
  - name: already sorted
    input: {nums: [0, 0, 1, 1, 2, 2]}
    expected: [0, 0, 1, 1, 2, 2]
  - name: single colour
    input: {nums: [1, 1, 1]}
    expected: [1, 1, 1]
  - name: two elements
    input: {nums: [2, 0]}
    expected: [0, 2]
  - name: reverse sorted
    input: {nums: [2, 2, 1, 1, 0, 0]}
    expected: [0, 0, 1, 1, 2, 2]
  - name: swap from high brings a zero
    input: {nums: [1, 2, 0]}
    expected: [0, 1, 2]
  - name: only 0 and 2
    input: {nums: [2, 0, 2, 0, 2]}
    expected: [0, 0, 2, 2, 2]
