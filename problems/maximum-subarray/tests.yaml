kind: function
entry: Solution.maxSubArray
scaffolds: []
args: [nums]
cases:
  - name: example 1
    input: {nums: [-2, 1, -3, 4, -1, 2, 1, -5, 4]}
    expected: 6
  - name: example 2 single element
    input: {nums: [1]}
    expected: 1
  - name: example 3 whole array
    input: {nums: [5, 4, -1, 7, 8]}
    expected: 23
  - name: all negative
    input: {nums: [-3, -2, -1]}
    expected: -1
  - name: single negative
    input: {nums: [-1]}
    expected: -1
  - name: negative first
    input: {nums: [-2, -1]}
    expected: -1
  - name: restart after a big loss
    input: {nums: [8, -19, 5, -4, 20]}
    expected: 21
