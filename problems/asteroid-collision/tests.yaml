kind: function
entry: Solution.asteroidCollision
scaffolds: []
args: [asteroids]
cases:
  - name: example 1
    input: {asteroids: [5, 10, -5]}
    expected: [5, 10]
  - name: example 2 equal sizes annihilate
    input: {asteroids: [8, -8]}
    expected: []
  - name: example 3
    input: {asteroids: [10, 2, -5]}
    expected: [10]
  - name: left-movers first never meet right-movers
    input: {asteroids: [-2, -1, 1, 2]}
    expected: [-2, -1, 1, 2]
  - name: big left-mover clears everything
    input: {asteroids: [1, 2, 3, -4]}
    expected: [-4]
  - name: left-mover survives and later ones follow
    input: {asteroids: [1, -2, -2, -2]}
    expected: [-2, -2, -2]
  - name: chain reaction ends in a tie
    input: {asteroids: [2, -1, 1, -2]}
    expected: []
  - name: tie then new right-mover
    input: {asteroids: [3, -3, 3]}
    expected: [3]
  - name: two left-movers
    input: {asteroids: [-7, -3]}
    expected: [-7, -3]
  - name: all moving right
    input: {asteroids: [1, 2, 3]}
    expected: [1, 2, 3]
