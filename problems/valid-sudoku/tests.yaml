    input:
      board:
        - ["5", "3", ".", ".", "7", ".", ".", ".", "."]
        - ["6", ".", ".", "1", "9", "5", ".", ".", "."]
        - [".", "9", "8", ".", ".", ".", ".", "6", "."]
        - ["8", ".", ".", ".", "6", ".", ".", ".", "3"]
        - ["4", ".", ".", "8", ".", "3", ".", ".", "1"]
        - ["7", ".", ".", ".", "2", ".", ".", ".", "6"]
        - [".", "6", ".", ".", ".", ".", "2", "8", "."]
        - [".", ".", ".", "4", "1", "9", ".", ".", "5"]
        - [".", ".", ".", ".", "8", ".", ".", "7", "9"]
    expected: true
  - name: example 2 duplicate 8 in column and box
    input:
      board:
        - ["8", "3", ".", ".", "7", ".", ".", ".", "."]
        - ["6", ".", ".", "1", "9", "5", ".", ".", "."]
        - [".", "9", "8", ".", ".", ".", ".", "6", "."]
