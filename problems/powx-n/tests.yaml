kind: function
entry: Solution.myPow
scaffolds: []
args: [x, n]
compare: float:0.00001
cases:
  - name: example 1
    input: {x: 2.0, n: 10}
    expected: 1024.0
  - name: example 2 fractional base
    input: {x: 2.1, n: 3}
    expected: 9.261
  - name: example 3 negative exponent
    input: {x: 2.0, n: -2}
    expected: 0.25
  - name: zero exponent
    input: {x: 5.0, n: 0}
    expected: 1.0
  - name: zero base
    input: {x: 0.0, n: 5}
    expected: 0.0
  - name: one to a huge power
    input: {x: 1.0, n: 2147483647}
    expected: 1.0
  - name: minus one odd huge power
    input: {x: -1.0, n: 2147483647}
    expected: -1.0
  - name: minus one with minimum exponent
    input: {x: -1.0, n: -2147483648}
    expected: 1.0
  - name: negative base odd negative exponent
    input: {x: -2.0, n: -3}
    expected: -0.125
  - name: negative base odd exponent
    input: {x: -2.0, n: 3}
    expected: -8.0
  - name: fraction to a power
    input: {x: 0.5, n: 10}
    expected: 0.0009765625
  - name: base two with minimum exponent underflows to zero
    input: {x: 2.0, n: -2147483648}
    expected: 0.0
