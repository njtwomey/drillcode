kind: function
entry: Solution.merge
scaffolds: []
args: [nums1, m, nums2, n]
compare: in_place:nums1
cases:
  - name: example 1
    input: {nums1: [1, 2, 3, 0, 0, 0], m: 3, nums2: [2, 5, 6], n: 3}
    expected: [1, 2, 2, 3, 5, 6]
  - name: example 2 empty nums2
    input: {nums1: [1], m: 1, nums2: [], n: 0}
    expected: [1]
  - name: example 3 empty nums1 prefix
    input: {nums1: [0], m: 0, nums2: [1], n: 1}
    expected: [1]
  - name: all of nums2 smaller
    input: {nums1: [4, 5, 6, 0, 0, 0], m: 3, nums2: [1, 2, 3], n: 3}
    expected: [1, 2, 3, 4, 5, 6]
  - name: all of nums2 larger
    input: {nums1: [1, 2, 3, 0, 0, 0], m: 3, nums2: [4, 5, 6], n: 3}
    expected: [1, 2, 3, 4, 5, 6]
  - name: single elements out of order
    input: {nums1: [2, 0], m: 1, nums2: [1], n: 1}
    expected: [1, 2]
  - name: negatives and duplicates
    input: {nums1: [-1, 0, 0, 3, 3, 3, 0, 0, 0], m: 6, nums2: [1, 2, 2], n: 3}
    expected: [-1, 0, 0, 1, 2, 2, 3, 3, 3]
  - name: interleaved
    input: {nums1: [1, 3, 5, 7, 0, 0, 0, 0], m: 4, nums2: [2, 4, 6, 8], n: 4}
    expected: [1, 2, 3, 4, 5, 6, 7, 8]
