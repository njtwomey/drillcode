kind: function
entry: Solution.searchMatrix
scaffolds: []
args: [matrix, target]
cases:
  - name: example 1
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]], target: 3}
    expected: true
  - name: example 2
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]], target: 13}
    expected: false
  - name: single row found
    input: {matrix: [[1, 3, 5]], target: 5}
    expected: true
  - name: single column found
    input: {matrix: [[1], [3], [5]], target: 3}
    expected: true
  - name: single column missing
    input: {matrix: [[1], [3], [5]], target: 4}
    expected: false
  - name: 1x1 hit
    input: {matrix: [[1]], target: 1}
    expected: true
  - name: target below first element
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20]], target: 0}
    expected: false
  - name: target above last element
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20]], target: 21}
    expected: false
  - name: target between rows
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20]], target: 8}
    expected: false
  - name: first element of later row
    input: {matrix: [[1, 3, 5, 7], [10, 11, 16, 20], [23, 30, 34, 60]], target: 23}
    expected: true
