kind: function
entry: Solution.oddEvenList
scaffolds: [linked_list]
args: [head]
convert:
  head: linked_list
  result: linked_list
cases:
  - name: example 1 odd length
    input: {head: [1, 2, 3, 4, 5]}
    expected: [1, 3, 5, 2, 4]
  - name: example 2 odd length with duplicates
    input: {head: [2, 1, 3, 5, 6, 4, 7]}
    expected: [2, 3, 6, 7, 1, 5, 4]
  - name: empty list
    input: {head: []}
    expected: []
  - name: single node
    input: {head: [1]}
    expected: [1]
  - name: two nodes
    input: {head: [1, 2]}
    expected: [1, 2]
  - name: three nodes
    input: {head: [1, 2, 3]}
    expected: [1, 3, 2]
  - name: even length
    input: {head: [1, 2, 3, 4]}
    expected: [1, 3, 2, 4]
  - name: grouped by position not by value
    input: {head: [8, 8, 1, 1, 8, 8]}
    expected: [8, 1, 8, 8, 1, 8]
  - name: six nodes
    input: {head: [1, 2, 3, 4, 5, 6]}
    expected: [1, 3, 5, 2, 4, 6]
