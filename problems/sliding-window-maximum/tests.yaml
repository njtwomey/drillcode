kind: function
entry: Solution.maxSlidingWindow
scaffolds: []
args: [nums, k]
cases:
  - name: example 1
    input: {nums: [1, 3, -1, -3, 5, 3, 6, 7], k: 3}
    expected: [3, 3, 5, 5, 6, 7]
  - name: example 2
    input: {nums: [1], k: 1}
    expected: [1]
  - name: k is 1
    input: {nums: [1, -1], k: 1}
    expected: [1, -1]
  - name: k equals n
    input: {nums: [9, 11, 4], k: 3}
    expected: [11]
  - name: all values equal
    input: {nums: [4, 4, 4, 4], k: 2}
    expected: [4, 4, 4]
  - name: decreasing
    input: {nums: [5, 4, 3, 2, 1], k: 3}
    expected: [5, 4, 3]
  - name: increasing
    input: {nums: [1, 2, 3, 4, 5], k: 3}
    expected: [3, 4, 5]
  - name: maximum repeats across windows
    input: {nums: [-7, -8, 7, 5, 7, 1, 6, 0], k: 4}
    expected: [7, 7, 7, 7, 7]
  - name: maximum expires
    input: {nums: [9, 1, 2, 3], k: 2}
    expected: [9, 2, 3]
