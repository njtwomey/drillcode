kind: function
entry: Solution.insert
scaffolds: []
args: [intervals, newInterval]
cases:
  - name: example 1
    input: {intervals: [[1, 3], [6, 9]], newInterval: [2, 5]}
    expected: [[1, 5], [6, 9]]
  - name: example 2
    input: {intervals: [[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], newInterval: [4, 8]}
    expected: [[1, 2], [3, 10], [12, 16]]
  - name: empty list
    input: {intervals: [], newInterval: [5, 7]}
    expected: [[5, 7]]
  - name: contained in an interval
    input: {intervals: [[1, 5]], newInterval: [2, 3]}
    expected: [[1, 5]]
  - name: insert at the end
    input: {intervals: [[1, 5]], newInterval: [6, 8]}
    expected: [[1, 5], [6, 8]]
  - name: insert at the start
    input: {intervals: [[3, 5]], newInterval: [1, 2]}
    expected: [[1, 2], [3, 5]]
  - name: swallows everything
    input: {intervals: [[2, 3], [4, 5]], newInterval: [1, 10]}
    expected: [[1, 10]]
  - name: touching endpoints merge
    input: {intervals: [[1, 2], [5, 6]], newInterval: [2, 5]}
    expected: [[1, 6]]
  - name: fits in a gap
    input: {intervals: [[1, 2], [6, 7]], newInterval: [3, 4]}
    expected: [[1, 2], [3, 4], [6, 7]]
