kind: function
entry: Solution.dailyTemperatures
scaffolds: []
args: [temperatures]
cases:
  - name: example 1
    input: {temperatures: [73, 74, 75, 71, 69, 72, 76, 73]}
    expected: [1, 1, 4, 2, 1, 1, 0, 0]
  - name: example 2 increasing
    input: {temperatures: [30, 40, 50, 60]}
    expected: [1, 1, 1, 0]
  - name: example 3
    input: {temperatures: [30, 60, 90]}
    expected: [1, 1, 0]
  - name: strictly decreasing
    input: {temperatures: [90, 80, 70, 60]}
    expected: [0, 0, 0, 0]
  - name: single day
    input: {temperatures: [50]}
    expected: [0]
  - name: equal temperatures are not warmer
    input: {temperatures: [70, 70, 70]}
    expected: [0, 0, 0]
  - name: long wait then spike
    input: {temperatures: [89, 62, 70, 58, 47, 47, 46, 76, 100, 70]}
    expected: [8, 1, 5, 4, 3, 2, 1, 1, 0, 0]
