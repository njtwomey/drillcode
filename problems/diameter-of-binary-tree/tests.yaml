kind: function
entry: Solution.diameterOfBinaryTree
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [1, 2, 3, 4, 5]}
    expected: 3
  - name: example 2
    input: {root: [1, 2]}
    expected: 1
  - name: single node
    input: {root: [1]}
    expected: 0
  - name: empty tree
    input: {root: []}
    expected: 0
  - name: right skewed chain
    input: {root: [1, null, 2, null, 3]}
    expected: 2
  - name: longest path inside one subtree
    input: {root: [1, 2, null, 3, 4, 5, null, null, 6]}
    expected: 4
  - name: path through root
    input: {root: [1, 2, 3, 4, null, null, 5]}
    expected: 4
