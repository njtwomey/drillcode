kind: operations
entry: LRUCache
scaffolds: []
cases:
  - name: example 1
    ops: [["LRUCache", [2]], ["put", [1, 1]], ["put", [2, 2]], ["get", [1]], ["put", [3, 3]], ["get", [2]], ["put", [4, 4]], ["get", [1]], ["get", [3]], ["get", [4]]]
    expected: [null, null, null, 1, null, -1, null, -1, 3, 4]
  - name: capacity one
    ops: [["LRUCache", [1]], ["put", [1, 1]], ["put", [2, 2]], ["get", [1]], ["get", [2]]]
    expected: [null, null, null, -1, 2]
  - name: put existing key updates and refreshes
    ops: [["LRUCache", [2]], ["put", [1, 1]], ["put", [2, 2]], ["put", [1, 10]], ["put", [3, 3]], ["get", [2]], ["get", [1]]]
    expected: [null, null, null, null, null, -1, 10]
  - name: get missing key
    ops: [["LRUCache", [2]], ["get", [5]]]
    expected: [null, -1]
  - name: get refreshes recency
    ops: [["LRUCache", [2]], ["put", [1, 1]], ["put", [2, 2]], ["get", [1]], ["put", [3, 3]], ["get", [1]], ["get", [2]]]
    expected: [null, null, null, 1, null, 1, -1]
