kind: function
entry: Solution.lowestCommonAncestor
scaffolds: [tree]
args: [root, p, q]
convert:
  root: tree
  p: tree_node:root
  q: tree_node:root
  result: node_val
cases:
  - name: example 1 different subtrees of the root
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 5, q: 1}
    expected: 3
  - name: example 2 ancestor of the other
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 5, q: 4}
    expected: 5
  - name: example 3 two nodes
    input: {root: [1, 2], p: 1, q: 2}
    expected: 1
  - name: both in left subtree
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 6, q: 4}
    expected: 5
  - name: deep nodes meeting at an inner node
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 7, q: 4}
    expected: 2
  - name: deep nodes meeting at the root
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 7, q: 8}
    expected: 3
  - name: argument order reversed
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 0, q: 8}
    expected: 1
  - name: target is the root
    input: {root: [3, 5, 1, 6, 2, 0, 8, null, null, 7, 4], p: 3, q: 7}
    expected: 3
