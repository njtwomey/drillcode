kind: function
entry: Solution.carFleet
scaffolds: []
args: [target, position, speed]
cases:
  - name: example 1
    input: {target: 12, position: [10, 8, 0, 5, 3], speed: [2, 4, 1, 1, 3]}
    expected: 3
  - name: example 2 single car
    input: {target: 10, position: [3], speed: [3]}
    expected: 1
  - name: example 3 everyone merges
    input: {target: 100, position: [0, 2, 4], speed: [4, 2, 1]}
    expected: 1
  - name: same speed never merges
    input: {target: 10, position: [0, 2, 4], speed: [1, 1, 1]}
    expected: 3
  - name: fleet forms mid-way and a slow car stays apart
    input: {target: 20, position: [5, 10, 0], speed: [3, 1, 1]}
    expected: 2
  - name: arrive at the target at the same time
    input: {target: 10, position: [5, 0], speed: [1, 2]}
    expected: 1
  - name: positions unsorted, slower car ahead holds up all
    input: {target: 12, position: [0, 6, 3], speed: [3, 1, 2]}
    expected: 1
  - name: fast car ahead is never caught
    input: {target: 10, position: [8, 3], speed: [2, 3]}
    expected: 2
  - name: chain of merges then a gap
    input: {target: 100, position: [90, 80, 70, 0], speed: [1, 5, 10, 2]}
    expected: 2
