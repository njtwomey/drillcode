kind: function
entry: Solution.search
scaffolds: []
args: [nums, target]
cases:
  - name: example 1
    input: {nums: [-1, 0, 3, 5, 9, 12], target: 9}
    expected: 4
  - name: example 2 absent
    input: {nums: [-1, 0, 3, 5, 9, 12], target: 2}
    expected: -1
  - name: empty array
    input: {nums: [], target: 5}
    expected: -1
  - name: single element found
    input: {nums: [5], target: 5}
    expected: 0
  - name: single element missing
    input: {nums: [5], target: 3}
    expected: -1
  - name: below first
    input: {nums: [1, 3, 5, 7], target: 0}
    expected: -1
  - name: above last
    input: {nums: [1, 3, 5, 7], target: 9}
    expected: -1
  - name: first element
    input: {nums: [1, 3, 5, 7], target: 1}
    expected: 0
  - name: last element
    input: {nums: [1, 3, 5, 7], target: 7}
    expected: 3
