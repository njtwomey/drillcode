kind: function
entry: Solution.longestConsecutive
scaffolds: []
args: [nums]
cases:
  - name: example 1
    input: {nums: [100, 4, 200, 1, 3, 2]}
    expected: 4
  - name: example 2
    input: {nums: [0, 3, 7, 2, 5, 8, 4, 6, 0, 1]}
    expected: 9
  - name: example 3 (duplicates)
    input: {nums: [1, 0, 1, 2]}
    expected: 3
  - name: empty array
    input: {nums: []}
    expected: 0
  - name: single element
    input: {nums: [5]}
    expected: 1
  - name: all duplicates
    input: {nums: [1, 1, 1]}
    expected: 1
  - name: negative numbers
    input: {nums: [-1, -2, -3, 5]}
    expected: 3
  - name: spans zero with two runs
    input: {nums: [9, 1, 4, 7, 3, -1, 0, 5, 8, -1, 6]}
    expected: 7
