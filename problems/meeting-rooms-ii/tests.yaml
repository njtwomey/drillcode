    input: {intervals: [[7, 10], [2, 4]]}
    expected: 1
  - name: touching meetings share a room
    input: {intervals: [[1, 5], [5, 10]]}
    expected: 1
  - name: all overlap
    input: {intervals: [[1, 10], [2, 10], [3, 10]]}
    expected: 3
  - name: single meeting
    input: {intervals: [[1, 2]]}
    expected: 1
  - name: unsorted with touching
    input: {intervals: [[9, 10], [4, 9], [4, 17]]}
    expected: 2
  - name: short meeting inside a long one
    input: {intervals: [[1, 5], [2, 3], [4, 6]]}
    expected: 2
  - name: one long meeting with several short ones
    input: {intervals: [[1, 10], [2, 3], [4, 5], [6, 7]]}
    expected: 2
