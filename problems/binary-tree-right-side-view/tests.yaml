kind: function
entry: Solution.rightSideView
scaffolds: [tree]
args: [root]
convert:
  root: tree
cases:
  - name: example 1
    input: {root: [1, 2, 3, null, 5, null, 4]}
    expected: [1, 3, 4]
  - name: example 2
    input: {root: [1, 2, 3, 4, null, null, null, 5]}
    expected: [1, 3, 4, 5]
  - name: example 3
    input: {root: [1, null, 3]}
    expected: [1, 3]
  - name: empty tree
    input: {root: []}
    expected: []
  - name: left subtree deeper than right
    input: {root: [1, 2, 3, 4, 5, null, null, 6, 7]}
    expected: [1, 3, 5, 7]
  - name: left skewed
    input: {root: [1, 2, null, 3, null, 4]}
    expected: [1, 2, 3, 4]
  - name: single node
    input: {root: [9]}
    expected: [9]
  - name: right child missing at a level but present deeper on left
    input: {root: [1, 2, 3, null, 4]}
    expected: [1, 3, 4]
